name: ci

# Tier-1 of the automated test harness (docs/testing/automated-test-harness.md):
# unit + API (httptest) + CLI-vs-in-proc-daemon + TUI (teatest). All run with no
# Docker on GitHub-hosted runners, so this fires on every push + PR. The Tier-2
# Docker matrix and the Tier-3 macOS-host suite run on a schedule from
# nightly.yml (a disabled scaffold today — see that file).

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  # build runs the full Tier-1 suite (build + vet + `go test ./...`, which now
  # includes the teatest TUI tests, the CLI table tests, and the httptest API
  # handler tests — none of which need Docker) on both Linux and macOS.
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # PINNED to go.mod's toolchain, NOT "stable" — this one is coupled to the
      # linter below. golangci-lint typechecks with the Go it was built against,
      # so when Go 1.27 shipped and `stable` moved to it, the pinned v2.12.2
      # (built with 1.26) panicked on the 1.27 stdlib: "file requires newer Go
      # version go1.27 (application built with go1.26)". Lint went red on master
      # and on every open PR, for a change nobody made.
      #
      # The version below was pinned for exactly this class of problem and the
      # floating half was left next to it. Bump the two together.
      #
      # The cost, stated: lint typechecks against 1.26 while the build jobs use
      # the latest Go. A 1.27-only construct would build and go unlinted — which
      # go.mod's `go 1.26.3` already disallows, so the window is narrow.
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
      # action v7 drives golangci-lint v2 (v6 drove v1). The version is PINNED, not
      # "latest": a floating latest silently jumped to v2 while the config was still
      # v1-format, failing every CI run since May 2026. Bump deliberately alongside
      # the .golangci.yml schema.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  # shellcheck keeps the live test suites (the Tier-2 integration suite plus the
  # Tier-3/Tier-4 scripts run on the Mac-mini runner) lint-clean on every PR even
  # though CI can't execute them — a broken edit is caught here, not later on the
  # runner. The tier3/tier4 scripts `source` lib.sh, so point shellcheck at it.
  #
  # install.sh and scripts/setup.sh are here because they were NOT, and they are
  # the two scripts every new user runs. The first lint of setup.sh found three
  # error-path messages using backticks inside double quotes — one of which ran
  # `colima delete` on the user's VM as a side effect of printing advice about
  # it. -x so the setup.sh → lib/tty.sh source is followed.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck the installer and the live test suites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck -x install.sh \
            scripts/setup.sh \
            scripts/lib/tty.sh \
            scripts/lib/tty_test.sh \
            scripts/verify-secrets-propagation.sh \
            scripts/verify-ssh-forward-semantics.sh \
            scripts/integration.sh \
            scripts/install-channels-check.sh \
            scripts/metrics/install-totals.sh \
            scripts/lib/report.sh \
            scripts/report-to-issue.sh \
            scripts/tier3/lib.sh \
            scripts/tier3/safe.sh \
            scripts/tier3/system.sh \
            scripts/tier3/tui-claude.sh \
            scripts/tier3/onboard-selftest.sh \
            scripts/tier4/agent-smoke.sh \
            scripts/clean-mac/lib.sh \
            scripts/clean-mac/proof-loop.sh \
            scripts/clean-mac/teardown.sh

  # The installer's "is anyone home?" logic, exercised under a real pty. This is
  # the only automated coverage the fresh-install path has: the clean-Mac runner
  # was torn down, so nothing else executes any of it. Runs anywhere — it stubs
  # nothing and installs nothing, it just drives the terminal decisions.
  installer-tty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: installer terminal detection (#341)
        run: ./scripts/lib/tty_test.sh
