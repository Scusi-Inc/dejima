name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # action v7 drives golangci-lint v2 (v6 drove v1). The version is PINNED, not
      # "latest": a floating latest silently jumped to v2 while the config was still
      # v1-format, failing every CI run since May 2026. Bump deliberately alongside
      # the .golangci.yml schema.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
