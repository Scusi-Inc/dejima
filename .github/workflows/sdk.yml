name: sdk

# SDKs + OpenAPI spec. Separate from ci.yml (the Go build/lint) so the lanes
# don't collide on one file. Scoped to the spec + SDK trees so it stays quiet on
# daemon-only changes.
on:
  push:
    branches: [master, main]
    # internal/api/** so a daemon route change trips the parity check too.
    paths: ["openapi.yaml", "redocly.yaml", "sdk/**", "internal/api/**", ".github/workflows/sdk.yml"]
  pull_request:
    paths: ["openapi.yaml", "redocly.yaml", "sdk/**", "internal/api/**", ".github/workflows/sdk.yml"]

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned, not "@latest": a floating spec linter can fail CI on a rule the
      # spec predates. Bump deliberately.
      - name: Lint spec
        run: npx --yes @redocly/cli@1.34.5 lint
      # Route parity: every internal/api route must be documented, and vice versa.
      - name: Route parity (server.go ↔ openapi.yaml)
        run: |
          pip install pyyaml
          python sdk/openapi_parity.py

  python-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build      # smoke-test that the package is publishable

  ts-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test
