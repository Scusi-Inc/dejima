name: sdk-publish

# Tag-driven SDK publish. DORMANT by design: the actual upload step is skipped
# until the matching repo secret exists:
#   - PYPI_API_TOKEN  → publishes sdk/python to PyPI
#   - NPM_TOKEN       → publishes sdk/ts to npm
# The build/test steps run regardless (cheap, and they prove the package is
# publishable); only the upload is gated, so an early tag never hard-fails.
#
# Triggers:
#   - push of a `v*` tag (the normal release path), and
#   - workflow_dispatch with an existing tag (re-run a publish for a tag that was
#     pushed before the secrets/names existed — no need to re-tag).
#
# Versioning: the PUBLISHED version is stamped from the tag (v0.4.0 → 0.4.0) into
# pyproject.toml / package.json (+ the in-package __version__ / VERSION) at build
# time, so the committed sources keep a stable dev baseline. The SDKs are 0.x
# ("0.x — may change"); the tag drives the real version.
#
# NOTE: `secrets` can't be read in a job-level `if:`, so each job maps its secret
# to a job env var and the upload step guards on that env (allowed in a step `if:`).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish (e.g. v0.4.0)"
        required: true
        type: string

jobs:
  publish-python:
    runs-on: ubuntu-latest
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v5
        with:
          # Build the tagged commit, whether triggered by a tag push or a manual
          # dispatch naming an existing tag.
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Stamp version from tag
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          if [ -z "$VERSION" ]; then echo "::error::could not derive version from '$REF'"; exit 1; fi
          echo "Publishing version $VERSION"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" pyproject.toml
          sed -i -E "s/^__version__ = \"[^\"]*\"/__version__ = \"$VERSION\"/" dejima/__init__.py
          grep -E '^version = ' pyproject.toml
      - run: pip install build twine
      - run: python -m build
      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        # --skip-existing so re-running a tag whose version is already on PyPI is
        # a no-op rather than a hard failure.
        run: twine upload --skip-existing dist/*

  publish-ts:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    defaults:
      run:
        working-directory: sdk/ts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Stamp version from tag
        run: |
          REF="${{ inputs.tag || github.ref_name }}"
          VERSION="${REF#v}"
          if [ -z "$VERSION" ]; then echo "::error::could not derive version from '$REF'"; exit 1; fi
          echo "Publishing version $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          sed -i -E "s/(export const VERSION = )\"[^\"]*\"/\1\"$VERSION\"/" src/index.ts
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
