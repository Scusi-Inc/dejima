name: release

# Tag-driven releases: push a semver tag (e.g. v0.1.0) to build and publish
# prebuilt archives. The first public release is v0.1.0 — see docs/roadmap.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history + tags so the version bakes correctly

      - uses: actions/setup-go@v6
        with:
          go-version: stable

      # fit.txt is PUBLIC (dejima.tech/fit.txt, linked from llms.txt and the
      # index) and its entire value is being straight with an evaluator about
      # what does and does not work yet. That value is destroyed by being WRONG,
      # and inside one week it was wrong in BOTH directions: it claimed the
      # Windows path worked after that path regressed, and it nearly shipped
      # "has never worked end to end" the day after it started working.
      #
      # Neither was carelessness. Both were true when written and then expired,
      # which is the whole problem — a VERDICT rots silently while the file goes
      # on looking maintained. So staleness is made loud at the one moment it
      # matters: nothing else in this pipeline looks at prose, and a release is
      # exactly when a stranger reads that file for the first time.
      #
      # Before 1.0 this allows a drift budget; at 1.0+ it demands zero. Not
      # symmetry for its own sake — a doc that must be rewritten for every patch
      # gets rewritten carelessly, but a launch shipping "verified at v0.8.67"
      # is indefensible.
      #
      # It runs BEFORE the build on purpose. Failing after the archives are
      # built and published would leave the release half-made.
      - name: fit.txt is current for this release
        run: python3 scripts/fit-freshness-check.py "${GITHUB_REF_NAME}"

      - name: Sanity build + tests
        run: |
          go build ./...
          go test ./...

      # Cross-compiles every target (Go needs no Mac to build darwin). Unix
      # archives carry dejima + dejimad; Windows carries the client only.
      - name: Build release archives
        run: make release-binaries VERSION=${GITHUB_REF_NAME}

      # NOTE: darwin binaries are currently UNSIGNED, so Gatekeeper quarantines
      # them on download (install-client.sh / brew strip the attribute). To
      # notarize, move the darwin build to a macos-latest job and add the
      # sign/notarize/staple steps — full runbook + drop-in YAML in
      # docs/release-notarization.md. Tracked in docs/roadmap.md (0.1.0 gate).

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dejima_*.tar.gz
            dist/dejima_*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Tags with a pre-release suffix (e.g. v0.1.0-rc1) publish as a GitHub
          # prerelease — use one to smoke-test the pipeline before going public.
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Regenerate the Homebrew formula from the release's SHA256SUMS and push it to
  # the aoos/homebrew-dejima tap, so `brew install aoos/dejima/dejima` always
  # points at the latest stable. No-ops cleanly until the tap + token exist:
  #   - skips pre-release tags (no stable bump for rc/beta builds)
  #   - skips entirely unless the HOMEBREW_TAP_TOKEN secret is set (a PAT or
  #     fine-grained token with `contents:write` on aoos/homebrew-dejima)
  homebrew-tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # for scripts/gen-homebrew-formula.sh

      - name: Gate on tap token
        id: gate
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update for ${GITHUB_REF_NAME}"
          fi

      - name: Generate formula from release checksums
        if: steps.gate.outputs.ok == '1'
        run: |
          curl -fsSL "https://github.com/aoos/dejima/releases/download/${GITHUB_REF_NAME}/SHA256SUMS" -o SHA256SUMS
          bash scripts/gen-homebrew-formula.sh "${GITHUB_REF_NAME}" SHA256SUMS > dejima.rb
          echo "--- generated formula ---"; cat dejima.rb

      - name: Push to aoos/homebrew-dejima
        if: steps.gate.outputs.ok == '1'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/aoos/homebrew-dejima.git" tap
          mkdir -p tap/Formula
          cp dejima.rb tap/Formula/dejima.rb
          cd tap
          git config user.name  "dejima-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          # Stage first, then check the *staged* diff — `git diff --quiet` alone
          # ignores untracked files, so on a fresh/empty tap it would skip the
          # very first commit. `--cached` catches both new and modified formulas.
          git add Formula/dejima.rb
          if git diff --cached --quiet; then
            echo "tap already up to date for ${GITHUB_REF_NAME}"; exit 0
          fi
          git commit -m "dejima ${GITHUB_REF_NAME}"
          # Push to the tap's default branch explicitly: cloning an empty repo
          # can leave HEAD on a differently-named local branch.
          git push origin HEAD:main

  # Publish the `dejima` npm package + its per-platform binary packages
  # (@dejima/cli-<platform>-<arch>). Runs after the release so the archives +
  # SHA256SUMS the platform packages embed already exist.
  #
  # NO postinstall: the binary ships INSIDE the platform packages as
  # optionalDependencies, so `npm i dejima` works under npm 11's default
  # script-blocking (the old `node ./install.js` download was silently blocked).
  #
  # Gating — this job always BUILDS + dry-run-validates the packages, but only
  # PUBLISHES when BOTH are true:
  #   - secrets.NPM_TOKEN is set (publish auth), and
  #   - vars.NPM_PLATFORM_PUBLISH == 'enabled' (operator opt-in, flipped once the
  #     @dejima npm scope exists + the token can publish to it).
  # Until then the publish is held; the build still proves the packaging is sound.
  # Skips pre-release tags.
  publish-npm-cli:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Rebuild the same release archives the GitHub Release carries, so the
      # platform packages embed byte-identical, checksum-verified binaries.
      - name: Build release archives
        run: make release-binaries VERSION=${GITHUB_REF_NAME}

      - name: Build platform packages + stamp main package
        run: node npm/scripts/build-platform-packages.mjs "${GITHUB_REF_NAME}" dist

      - name: Publish (or validate, when held)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_ENABLED: ${{ vars.NPM_PLATFORM_PUBLISH }}
        run: |
          set -euo pipefail
          # Publish only with auth AND the operator opt-in; otherwise dry-run.
          if [ -n "${NPM_TOKEN:-}" ] && [ "${PUBLISH_ENABLED:-}" = "enabled" ]; then
            DRY=""
            echo "::notice::Publishing dejima + platform packages for ${GITHUB_REF_NAME}"
          else
            DRY="--dry-run"
            if [ -z "${NPM_TOKEN:-}" ]; then
              echo "::notice::NPM_TOKEN not set — validating npm packages (dry-run) for ${GITHUB_REF_NAME}, not publishing"
            else
              echo "::notice::vars.NPM_PLATFORM_PUBLISH != 'enabled' — publish HELD; validating (dry-run). Set it once the @dejima scope exists."
            fi
          fi
          # Platform packages FIRST so the main package's optionalDependencies
          # resolve on the registry; then the main `dejima` package. Paths are
          # `./`-prefixed so npm treats them as directories, never as the name of
          # a registry package (a bare `npm` would fetch the npm package itself).
          for d in ./npm/platforms/*/; do
            echo "→ $d"
            npm publish $DRY --access public "$d"
          done
          echo "→ ./npm (main dejima package)"
          npm publish $DRY --access public ./npm
