# Dejima tmux defaults — applied inside every island.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
# Truecolor to the OUTER terminal. This was keyed to xterm-256color, which never
# matched in practice: the outer client arrives over the daemon's docker-exec PTY
# (and Windows OpenSSH sets TERM=xterm outright), so tmux saw a bare `xterm` —
# terminfo's 8-color entry — and reported `colors: 8`, `Tc: [missing]`, `RGB:
# [missing]`. Match `*` like the extkeys/sync features below, and state it as a
# terminal-feature (tmux 3.2+'s form) rather than a raw Tc override. Terminals
# that genuinely can't do RGB are vanishingly rare and degrade gracefully.
set -as terminal-features ",*:RGB"

# Let modern terminal escape sequences pass straight through tmux to the agent
# and back to the outer terminal. Without this tmux swallows:
#   - DCS passthrough (image protocols, OSC 52 clipboard, desktop notifications
#     via OSC 9/777) — `allow-passthrough on` forwards them untouched.
#   - the CSI-u "extended keys" encoding modern CLIs use to tell Shift+Enter from
#     a bare Enter — `extended-keys on` + the Csu override negotiate it so newer
#     agent TUIs (Claude Code, etc.) see Shift+Enter inside tmux.
# See docs/tmux-passthrough.md.
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -ga terminal-overrides ",*:Csu=\\E[%p1%d;%p2%du"

# Synchronized output (DECSET 2026). Agent TUIs (Claude Code's Ink renderer, etc.)
# repaint a whole frame per state change; without telling tmux the outer terminal
# can batch, tmux flushes each repaint unbuffered and the outer terminal —
# especially Windows Terminal / ConPTY — coalesces the partial writes wrong,
# smearing a line's leading chars down the left column as the transcript scrolls
# (only a Ctrl-L full repaint clears it). Advertising `sync` makes tmux wrap its
# redraws to the outer terminal in 2026 begin/end so each frame lands atomically.
# Needs tmux 3.4+ (Ubuntu 24.04 base ships 3.4); terminals without 2026 ignore it.
set -as terminal-features ",*:sync"

# Size the session to the latest-attached client (tmux 3.x default; pinned
# defensively). default-size is what start.sh's detached `tmux new-session -d`
# uses before any client exists — bump it up so the agent's first render isn't
# stuck at 80x24 if it boots before a `dejima connect` lands.
set -g window-size latest
set -g default-size 200x50

# Keep windows numbered from 1 for sanity.
set -g base-index 1
setw -g pane-base-index 1

# Show the island name prominently in the status bar.
set -g status-left-length 40
set -g status-left "#[fg=green,bold]🏝  #{?DEJIMA_PROJECT_NAME,#{DEJIMA_PROJECT_NAME},dejima} #[default]"
set -g status-right "#[fg=cyan]#H #[default]"
