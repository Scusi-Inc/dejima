# Dejima tmux defaults — applied inside every island.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Size the session to the latest-attached client (tmux 3.x default; pinned
# defensively). default-size is what start.sh's detached `tmux new-session -d`
# uses before any client exists — bump it up so the agent's first render isn't
# stuck at 80x24 if it boots before a `dejima connect` lands.
set -g window-size latest
set -g default-size 200x50

# Keep windows numbered from 1 for sanity.
set -g base-index 1
setw -g pane-base-index 1

# Show the island name prominently in the status bar.
set -g status-left-length 40
set -g status-left "#[fg=green,bold]🏝  #{?DEJIMA_PROJECT_NAME,#{DEJIMA_PROJECT_NAME},dejima} #[default]"
set -g status-right "#[fg=cyan]#H #[default]"
