# Dejima tmux defaults — applied inside every island.

set -g mouse on
set -g history-limit 100000
set -g default-terminal "tmux-256color"
# --- outer-terminal capabilities (TERM-gated — deliberately NOT ",*:") -------
#
# RGB / extkeys / sync tell tmux the OUTER terminal can handle sequences tmux
# would otherwise filter out. Advertising them to a terminal that can't is not
# harmless: on Windows every emulator sits on ConPTY, a from-scratch
# reimplementation of pty semantics that parses these far less forgivingly than
# a kernel pty, and the visible result is full-width lines smearing their
# leading characters down the left column.
#
# All three had drifted to ",*:" one commit at a time — 38de6ab (extkeys,
# 2026-06-24), a07cce3 (sync, 2026-08-03), 7a23a75 (RGB, 2026-08-11) — for a
# defensible reason: there was no per-client signal to match on. `docker exec`
# propagates the DOCKER CLI's environment, so the island only ever saw the
# DAEMON's TERM, identical for every client and descriptive of none. Matching
# `*` was the only thing that worked. But `*` also matches a bare `xterm`
# (terminfo's 8-color entry, which Windows OpenSSH sets), so each commit handed
# ConPTY more rope and the bleed got worse rather than better.
#
# The client's real TERM now arrives — `dejima connect` sends it in its first
# resize envelope and the daemon passes it to `docker exec -e TERM=` (see
# bridge.TermEnv) — so this can finally match on something that describes the
# terminal actually looking at the output.
#
# One pattern is all that can ever match, and that is deliberate. This image
# installs ncurses-base only, so bridge.canonicalTERM folds any TERM it cannot
# guarantee resolves here (xterm-ghostty, xterm-kitty, alacritty, wezterm, …)
# down to xterm-256color — tmux refuses to start on an unknown terminfo entry,
# and a session that dies on attach is far worse than one that renders plainly.
# So every 256-color-capable terminal arrives as some *-256color name and keeps
# RGB/extkeys/sync; a client that genuinely reports bare `xterm` stays bare and
# is excluded, which is exactly the case this change exists to fix.
#
# `extended-keys on` below stays global on purpose — tmux only emits the CSI-u
# sequences to terminals that also carry the `extkeys` feature, so this line is
# what actually governs it.
set -as terminal-features ",*-256color:RGB:extkeys:sync"

# Let modern terminal escape sequences pass straight through tmux to the agent
# and back to the outer terminal. Without this tmux swallows:
#   - DCS passthrough (image protocols, OSC 52 clipboard, desktop notifications
#     via OSC 9/777) — `allow-passthrough on` forwards them untouched.
#   - the CSI-u "extended keys" encoding modern CLIs use to tell Shift+Enter from
#     a bare Enter — `extended-keys on` + the Csu override negotiate it so newer
#     agent TUIs (Claude Code, etc.) see Shift+Enter inside tmux.
# See docs/tmux-passthrough.md.
set -g allow-passthrough on
set -g extended-keys on
set -ga terminal-overrides ",*-256color:Csu=\\E[%p1%d;%p2%du"

# Synchronized output (DECSET 2026). Agent TUIs (Claude Code's Ink renderer, etc.)
# repaint a whole frame per state change; without telling tmux the outer terminal
# can batch, tmux flushes each repaint unbuffered and the outer terminal —
# especially Windows Terminal / ConPTY — coalesces the partial writes wrong,
# smearing a line's leading chars down the left column as the transcript scrolls
# (only a Ctrl-L full repaint clears it). Advertising `sync` makes tmux wrap its
# redraws to the outer terminal in 2026 begin/end so each frame lands atomically.
# Needs tmux 3.4+ (Ubuntu 24.04 base ships 3.4). Advertised in the TERM-gated
# block at the top of this file, not here — see the note there on why `,*:sync`
# made the Windows/ConPTY bleed worse instead of better.

# Size the session to the latest-attached client (tmux 3.x default; pinned
# defensively). default-size is what start.sh's detached `tmux new-session -d`
# uses before any client exists — bump it up so the agent's first render isn't
# stuck at 80x24 if it boots before a `dejima connect` lands.
set -g window-size latest
set -g default-size 200x50

# Keep windows numbered from 1 for sanity.
set -g base-index 1
setw -g pane-base-index 1

# Show the island name prominently in the status bar.
set -g status-left-length 40
set -g status-left "#[fg=green,bold]🏝  #{?DEJIMA_PROJECT_NAME,#{DEJIMA_PROJECT_NAME},dejima} #[default]"
set -g status-right "#[fg=cyan]#H #[default]"
