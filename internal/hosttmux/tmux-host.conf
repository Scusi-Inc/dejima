# Dejima host-terminal tmux config (applied ONLY to Dejima-created host tmux
# sessions via `tmux -f`). It does NOT replace the operator's own config: the
# first line below sources ~/.tmux.conf when present, so a user's customizations
# still apply — Dejima then layers its passthrough/extended-keys defaults on top.

# Inherit the operator's own config first (no-op if they have none).
source-file -q "~/.tmux.conf"

# Let modern terminal escape sequences pass straight through tmux: DCS image/
# OSC 52 clipboard / OSC 9/777 desktop-notification passthrough, plus the CSI-u
# "extended keys" encoding so Shift+Enter survives tmux into newer agent TUIs.
set -g allow-passthrough on
set -g extended-keys on
set -as terminal-features ",*:extkeys"
set -ga terminal-overrides ",*:Csu=\\E[%p1%d;%p2%du"
