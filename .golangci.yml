version: "2"

# golangci-lint v2 config.
#
# Scope notes (lint had never actually run in CI — the action installed v2 while
# the config was v1-format, failing with exit 3 on every run since May 2026):
#   - errcheck is intentionally NOT enabled (it only ever rode in via v1 defaults;
#     the project's curated list never listed it). `default: none` stops v2's
#     broader defaults from silently re-adding it.
#   - revive is dropped: in v2 its `rules` list is a whitelist (you can't disable a
#     few and keep the rest), and ~46 of its 50 findings here are doc-comment /
#     naming policy the codebase has never followed, with the rest overlapping
#     staticcheck/govet. Re-add with an explicit curated `rules:` list if wanted.
linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # QF1012 (prefer fmt.Fprintf over WriteString(fmt.Sprintf(...))) is a pure
      # style quickfix the TUI render code uses pervasively (~24 sites). Excluded
      # as policy rather than churning a hot file for no correctness/perf gain.
      - linters:
          - staticcheck
        text: "QF1012"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
