        scope: { type: string, description: scope name to read from }
        src_rel: { type: string, description: path relative to the scope's host root }
        dest: { type: string, description: "container path; default /intake/<scope>/<src_rel>" }
    PortIntakeResponse:
      type: object
      properties:
        scope: { type: string }
        src: { type: string }
        dest: { type: string }
        bytes: { type: integer }
