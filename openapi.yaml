        host_terminals_enabled: { type: boolean }
        ssh_addr: { type: string }
        daemon_version: { type: string }
        api_version: { type: integer }
        panicked: { type: boolean }
        host_memory_bytes: { type: integer }
        vm_memory_bytes: { type: integer }
        vm_recommended_bytes: { type: integer }
        owner: { type: string, description: "the authenticated caller's own tenant (multi-tenant who-am-i); empty when no identity" }
        role: { type: string, description: "the authenticated caller's role (owner|operator|viewer); empty when no identity" }
    AggregateResponse:
      type: object
      description: "Host-wide rollup across ALL islands (counts + totals only, NO names/repos/owners). Any authenticated caller."
      properties:
        total_islands: { type: integer }
        running: { type: integer }
        hibernated: { type: integer }
        memory_usage_bytes: { type: integer }
        memory_limit_bytes: { type: integer }
        cpu_percent: { type: number }
        disk_total_bytes: { type: integer }
    SessionEnvelope:
      type: object
      description: >
        The JSON message framing for the PTY WebSocket streams (island, agent,
        and host-terminal `/session` endpoints). NOT modeled as an HTTP body —
        documented here so clients can implement the wire protocol. Terminal
        bytes are base64-encoded in `b64`.

        Server → client: one `{type: hello, attached: [...]}` on connect, then
        `{type: data, b64}` for output, and `{type: error, b64}` on failure
        (where `b64` carries the plaintext error string, not base64).

        Client → server: `{type: data, b64}` for keystrokes and
        `{type: resize, rows, cols}` to resize the PTY.
      properties:
        type: { type: string, enum: [hello, data, resize, error] }
        b64: { type: string, description: base64-encoded PTY bytes (plaintext for type=error) }
        rows: { type: integer }
        cols: { type: integer }
        attached:
          type: array
          items: { $ref: "#/components/schemas/PresenceEntry" }
