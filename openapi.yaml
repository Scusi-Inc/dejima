        type: { type: string, description: "port.grant | port.revoke | trade.read | trade.write | capability.* | mcp.* | api.request | <lifecycle event>" }
        island: { type: string }
        agent: { type: string }
        scope: { type: string }
        path: { type: string, description: "host/scope path (trades) or request path (api.request)" }
        mode: { type: string }
        bytes: { type: integer }
        sha256: { type: string }
        decision: { type: string, description: allowed | denied }
        detail: { type: string }
        method: { type: string, description: "HTTP method (api.request)" }
        status: { type: integer, description: "HTTP status code (api.request)" }
        actor: { type: string, description: "who made the request (identity; filled by the auth layer)" }
        role: { type: string, description: "the actor's role, when known" }
        prev: { type: string, description: chain value of the previous entry }
        chain: { type: string, description: chain value of this entry }
    AuditResponse:
      type: object
