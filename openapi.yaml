openapi: 3.1.0
info:
  title: Dejima API
  version: "0.1"
  x-api-version: 1
  description: >
    HTTP/WebSocket control surface for the Dejima daemon (`dejimad`). This is the
    same API the CLI/TUI use and the contract third-party apps build on.

    Status: Dejima is in alpha (0.x). The `v1/` path prefix is intended to be
    stable, but fields may change until `v1.0.0`; an integer `api_version`
    (advertised on `/v1/overview`) tracks the client/daemon contract separately
    from the semver tag. This spec is hand-maintained from the route table in
    `internal/api/server.go` and the request/response shapes in
    `internal/api/types.go` — those are the source of truth and the spec may
    drift slightly between releases.

    WebSocket endpoints (PTY session streams) are listed for discoverability but
    cannot be fully modeled in OpenAPI; see the per-path notes and the
    `SessionEnvelope` schema for the wire protocol.
servers:
  - url: http://{host}
    description: Daemon over the tailnet (DEJIMA_HOST, e.g. 100.84.12.7:7273)
    variables:
      host:
        default: 127.0.0.1:7273
security:
  - bearerToken: []
  - {}   # operator listeners (unix socket / tailnet) carry no per-request token
tags:
  - name: islands
  - name: agents
  - name: exec-and-files
  - name: port
  - name: capability
  - name: mcp
  - name: credentials
  - name: tokens
  - name: events
  - name: activity
  - name: terminals
  - name: daemon
paths:
  /v1/islands:
    get:
      tags: [islands]
      summary: List all islands
      operationId: listIslands
      responses:
        "200":
          description: All islands, most-recently-used first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IslandInfo" }
    post:
      tags: [islands]
      summary: Create (provision) an island
      operationId: createIsland
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateIslandRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateIslandResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: An island with this name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}:
    parameters:
      - $ref: "#/components/parameters/Name"
    get:
      tags: [islands]
      summary: Island detail (agents, presence, cpu/mem, git, health, disk, resources)
      operationId: getIsland
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [islands]
      summary: Update cosmetic fields (title)
      operationId: updateIsland
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateIslandRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [islands]
      summary: Purge an island (container + volumes)
      operationId: deleteIsland
      parameters:
        - name: force
          in: query
          schema: { type: boolean }
          description: Bypass the unpushed-work guard
      responses:
        "204": { description: Purged }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused — unpushed/dirty work (retry with force=true)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/workspace-ready:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: Whether the island's repo clone has landed in /workspace yet
      operationId: workspaceReady
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ready: { type: boolean } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/resources:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    put:
      tags: [islands]
      summary: Update memory limit / OOM priority
      operationId: updateIslandResources
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateResourcesRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateResourcesResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/identity:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    put:
      tags: [islands]
      summary: Set the island's visual identity (color + glyph) override
      operationId: setIslandIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IslandIdentity" }
      responses:
        "200":
          description: OK — the updated island
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [islands]
      summary: Clear the island's visual identity override (revert to the default)
      operationId: clearIslandIdentity
      responses:
        "200":
          description: OK — the updated island
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/schedules:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: List the island's durable scheduled wakes
      operationId: listSchedules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScheduleInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [islands]
      summary: Add a durable scheduled wake (one-shot --at or recurring --every)
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleRequest" }
      responses:
        "201":
          description: Created — the new schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/schedules/{id}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
      - name: id
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [islands]
      summary: Cancel a scheduled wake
      operationId: deleteSchedule
      responses:
        "204": { description: No Content — the schedule was removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/hibernate:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [islands]
      summary: Stop the container, preserve volumes
      operationId: hibernateIsland
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/wake:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [islands]
      summary: Start the container against existing volumes
      operationId: wakeIsland
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/reset:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [islands]
      summary: Clear agent state (preserves workspace)
      operationId: resetIsland
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/upgrade:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [islands]
      summary: Recreate the container against the current image (both volumes preserved)
      operationId: upgradeIsland
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/clone:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [islands]
      summary: Copy an island (workspace + home volumes, drops Port grants)
      operationId: cloneIsland
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneIslandRequest" }
      responses:
        "201":
          description: Cloned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Target name already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/events:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: The island's recent event log (newest first)
      operationId: islandEvents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Event" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/egress:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: The island's recent outbound connections, as observed by the egress proxy (Phase 1, observe-only)
      operationId: islandEgress
      responses:
        "200":
          description: OK (empty when the egress proxy is disabled or the island hasn't connected out)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressEventsResponse" }
  /v1/islands/{name}/egress/policy:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: The island's egress policy (Phase 2). Reports the effective default (observe) when none is set.
      operationId: getEgressPolicy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPolicy" }
    patch:
      tags: [islands]
      summary: Set the island's egress policy — mode + add/remove allow/deny hosts (operator-only; ledgered)
      operationId: patchEgressPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EgressPolicyPatch" }
      responses:
        "200":
          description: OK — the resulting policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EgressPolicy" }
        "503": { description: egress proxy not enabled on this daemon }
  /v1/islands/{name}/spawn-grant:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [islands]
      summary: The island's ephemeral-sub-agent spawn grant (Granted=false when none — the deny default)
      operationId: getSpawnGrant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpawnGrantResponse" }
    post:
      tags: [islands]
      summary: Grant/update an island's spawn budget (operator-only; ledgered). In-island tokens can never reach this.
      operationId: setSpawnGrant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpawnGrantRequest" }
      responses:
        "200":
          description: OK — the resulting grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpawnGrantResponse" }
    delete:
      tags: [islands]
      summary: Revoke an island's spawn grant (operator-only; ledgered)
      operationId: revokeSpawnGrant
      responses:
        "204": { description: revoked }
        "404": { description: no spawn grant for this island }
  /v1/islands/{name}/agents:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [agents]
      summary: List agents in an island
      operationId: listAgents
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AgentInfo" }
    post:
      tags: [agents]
      summary: Add an agent to an island
      operationId: addAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentSpecRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInfo" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [agents]
      summary: Agent detail
      operationId: getAgent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [agents]
      summary: Rename an agent's cosmetic label
      operationId: updateAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { label: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentInfo" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [agents]
      summary: Remove an agent (any agent; islands may have zero)
      operationId: removeAgent
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused — the agent is the container's PID 1 (a headless first agent); hibernate or purge instead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/agents/{id}/move:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/AgentID"
    post:
      tags: [agents]
      summary: Reorder an agent within its island (cosmetic; delta positions, clamped)
      operationId: moveAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { delta: { type: integer, description: "positions to shift; negative = toward the front" } }
      responses:
        "200":
          description: OK — the island's agents in new order
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AgentInfo" } }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/agents/{id}/config:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/AgentID"
    patch:
      tags: [agents]
      summary: Set an agent's LLM provider/model (key-requiring frameworks only)
      operationId: configureAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentConfigRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentConfigResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The agent type does not use an LLM provider key
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/session:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [agents]
      summary: "WebSocket PTY stream (multi-attach). NOTE: WebSocket upgrade — see SessionEnvelope."
      operationId: sessionWS
      x-websocket: true
      responses:
        "101": { description: Switching Protocols (WebSocket) }
  /v1/islands/{name}/agents/{id}/session:
    parameters:
      - $ref: "#/components/parameters/Name"
      - $ref: "#/components/parameters/AgentID"
    get:
      tags: [agents]
      summary: "Per-agent WebSocket PTY stream. NOTE: WebSocket upgrade — see SessionEnvelope."
      operationId: agentSessionWS
      x-websocket: true
      responses:
        "101": { description: Switching Protocols (WebSocket) }
  /v1/islands/{name}/shell/session:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [agents]
      summary: "WebSocket PTY stream for the island's contained shell at /workspace (shared, resumable; not an agent). NOTE: WebSocket upgrade — see SessionEnvelope."
      operationId: islandShellWS
      x-websocket: true
      responses:
        "101": { description: Switching Protocols (WebSocket) }
  /v1/islands/{name}/exec:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [exec-and-files]
      summary: Run a one-shot command in an island
      operationId: exec
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/mailbox:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [mailbox]
      summary: Poll an island's intra-island agent mailbox
      operationId: pollMailbox
      parameters:
        - name: agent
          in: query
          schema: { type: string }
          description: Your agent id — filters to broadcasts plus messages addressed to you
        - name: since
          in: query
          schema: { type: integer, format: int64 }
          description: Only messages with seq greater than this cursor
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailboxPollResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [mailbox]
      summary: Send a message into an island's mailbox (intra-island only)
      operationId: sendMailbox
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailboxSendRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailboxSendResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/files/{path}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: path
        in: path
        required: true
        schema: { type: string }
        description: File path within the island (defaults to the primary worktree)
    get:
      tags: [exec-and-files]
      summary: Read a file from an island
      operationId: readFile
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [exec-and-files]
      summary: Write a file into an island
      operationId: writeFile
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "204": { description: Written }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/logs:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: agent
        in: query
        schema: { type: string }
      - name: follow
        in: query
        schema: { type: boolean }
    get:
      tags: [exec-and-files]
      summary: Stream container/agent logs
      operationId: logs
      responses:
        "200":
          description: Log text
          content:
            text/plain: { schema: { type: string } }
  /v1/islands/{name}/port/scopes:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [port]
      summary: List Port grants (brokered host-folder scopes)
      operationId: listPortScopes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortScopesResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [port]
      summary: Grant a scoped host folder (deny-all by default)
      operationId: grantPortScope
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortScopeRequest" }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortScopeView" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/port/scopes/{scope}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: scope
        in: path
        required: true
        schema: { type: string }
        description: Scope name (e.g. scope-1)
    delete:
      tags: [port]
      summary: Revoke a Port grant by scope name
      operationId: revokePortScope
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/port/intake:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [port]
      summary: Brokered read-only file import (host -> island), ledgered
      operationId: portIntake
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortIntakeRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortIntakeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/port/export:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [port]
      summary: Brokered export (island -> host staging), append-only ledger
      operationId: portExport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortExportRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortExportResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/port/write:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [port]
      summary: Brokered write (island -> a read-write host scope), ledgered
      operationId: portWrite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortWriteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortWriteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/capability/grants:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [capability]
      summary: List the host capability targets an island may invoke
      operationId: listCapabilityGrants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityGrantsResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [capability]
      summary: Grant permission to invoke a named host capability target
      operationId: grantCapability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityGrantRequest" }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityGrantView" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/islands/{name}/capability/grants/{target}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: target
        in: path
        required: true
        schema: { type: string }
        description: Capability target name
    delete:
      tags: [capability]
      summary: Revoke a capability grant by target name
      operationId: revokeCapability
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/capabilities/execute:
    post:
      tags: [capability]
      summary: Invoke a granted capability target (deny-all; every outcome ledgered)
      description: >
        Token-authenticated in-island callers are pinned to their own island
        (the `island` field is ignored); operators name the island explicitly.
      operationId: executeCapability
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CapabilityExecuteRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapabilityExecuteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: Capability not granted to this island
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: Capability execution unavailable on this host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/links:
    get:
      tags: [link]
      summary: List inter-island link grants (operator)
      operationId: listLinks
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinksResponse" }
    post:
      tags: [link]
      summary: Authorize a directional inter-island info channel (operator; deny-all default)
      operationId: grantLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkGrantRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkGrant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [link]
      summary: Revoke a link grant (operator)
      operationId: revokeLink
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: topic, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/link/send:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [link]
      summary: Send an info message to a specific agent in another island (granted channel)
      description: >
        The path island is the sender, pinned to the caller's token (it can only
        send as itself). Default-deny: with no matching operator grant the send is
        refused (403) and ledgered link.deny. A granted message is delivered into
        the target agent's ordinary mailbox with daemon-stamped cross-island
        Origin — so the response is a MailboxMessage.
      operationId: sendLink
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkSendRequest" }
      responses:
        "201":
          description: Delivered into the recipient's mailbox
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailboxMessage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: No link grant for this from→to/topic (cross-island is deny-all)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/link/actions:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [link]
      summary: List the action types this island exposes for cross-island delegation
      operationId: listExposedActions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkExposedResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/link/actions/{action}:
    parameters:
      - { $ref: "#/components/parameters/Name" }
      - { name: action, in: path, required: true, schema: { type: string } }
    put:
      tags: [link]
      summary: Expose a named action type (operator)
      operationId: exposeAction
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkExposedResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [link]
      summary: Stop exposing an action type (operator)
      operationId: unexposeAction
      responses:
        "204": { description: Unexposed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/link/action:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    post:
      tags: [link]
      summary: Request a named action on another island (deny-all; per-action approval)
      description: >
        The path island is the requester (token-pinned). Deny-all: requires a link
        grant for the channel AND the destination to expose the action. A
        pre-authorized action (in the grant's Actions allowlist) executes
        immediately (201, status "executed"); otherwise it is queued for operator
        approval (202, status "pending") and a link.action-pending event fires.
        Never a free-form prompt — only named, exposed action types.
      operationId: requestAction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkActionRequest" }
      responses:
        "201":
          description: Executed (pre-authorized)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkActionResponse" }
        "202":
          description: Queued for operator approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkActionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: No grant, or the action is not exposed by the destination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/link/actions:
    get:
      tags: [link]
      summary: List cross-island action requests awaiting operator approval
      operationId: listPendingActions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPendingResponse" }
  /v1/link/actions/watch:
    get:
      tags: [link]
      summary: Stream pending action approvals as Server-Sent Events (operator/viewer)
      description: >
        text/event-stream of `data: <ActionRequest JSON>` frames, one per new
        pending request, with a `: keepalive` comment on idle ticks. For an
        on-call operator or an external approval bot. The stream ends on client
        disconnect.
      operationId: watchActions
      responses:
        "200":
          description: An SSE stream
          content:
            text/event-stream:
              schema: { type: string }
  /v1/link/actions/{id}/approve:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [link]
      summary: Approve and execute a pending action (operator; owner/operator only)
      operationId: approveAction
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkActionResponse" }
        "404": { description: Unknown or expired (fail-closed) }
        "409": { description: The grant or exposed action changed; refused }
  /v1/link/actions/{id}/deny:
    parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
    post:
      tags: [link]
      summary: Deny a pending action (operator; owner/operator only)
      operationId: denyAction
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DenyActionRequest" }
      responses:
        "204": { description: Denied }
        "404": { description: Unknown or expired }
  /v1/policy:
    get:
      tags: [link]
      summary: List active auto-approve rules (operator)
      operationId: listPolicy
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyListResponse" }
    post:
      tags: [link]
      summary: Add a scoped auto-approve rule (operator; ledgered). Destructive actions are never auto-approved.
      operationId: addPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PolicyAddRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PolicyRule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [link]
      summary: Remove an auto-approve rule (operator; ledgered)
      operationId: removePolicy
      parameters:
        - { name: from, in: query, required: true, schema: { type: string } }
        - { name: to, in: query, required: true, schema: { type: string } }
        - { name: action, in: query, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/islands/{name}/mcp/grants:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [mcp]
      summary: List the MCP servers an island may call (deny-all by default)
      operationId: listMCPGrants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPGrantsResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [mcp]
      summary: Grant an island access to a registered MCP server
      operationId: grantMCP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPGrantRequest" }
      responses:
        "201":
          description: Granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPGrantView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: Already granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/mcp/grants/{server}:
    parameters:
      - $ref: "#/components/parameters/Name"
      - name: server
        in: path
        required: true
        schema: { type: string }
        description: MCP server name
    delete:
      tags: [mcp]
      summary: Revoke an island's MCP-server grant
      operationId: revokeMCP
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/mcp/call:
    post:
      tags: [mcp]
      summary: Invoke a method on a granted MCP server (deny-all; every call ledgered)
      description: >
        Token-authenticated in-island callers are pinned to their own island
        (the `island` field is ignored); operators name the island explicitly.
        The brokered call is the JSON-RPC `method` (e.g. `tools/list`,
        `tools/call`) with opaque `params`.
      operationId: mcpCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MCPCallRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MCPCallResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403":
          description: MCP server not granted to this island
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/islands/{name}/grants:
    parameters: [ { $ref: "#/components/parameters/Name" } ]
    get:
      tags: [grants]
      summary: All grant types for one island in a single shape (deny-all by default)
      description: >
        The unified per-island grants view: Port host-folder scopes, host
        capability targets, MCP servers, and the inter-island link channels that
        touch this island — in one operator-readable call instead of four. A
        fresh island returns empty arrays across all four (deny-all is genuine).
      operationId: listIslandGrants
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IslandGrantsResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/credentials/claude:
    get:
      tags: [credentials]
      summary: Whether new islands get Claude credentials, and from where (no secret)
      operationId: claudeCredentialsStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaudeCredentialsStatus" }
    put:
      tags: [credentials]
      summary: Push a Claude Code credentials blob as the seed new islands clone from
      operationId: pushClaudeCredentials
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushCredentialsRequest" }
      responses:
        "204": { description: Stored }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/credentials/github:
    get:
      tags: [credentials]
      summary: List the daemon's GitHub identities (no tokens)
      operationId: listGitHubIdentities
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubIdentitiesResponse" }
  /v1/credentials/github/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Identity name
    put:
      tags: [credentials]
      summary: Add or update a named GitHub identity
      operationId: putGitHubIdentity
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutGitHubIdentityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubIdentitiesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [credentials]
      summary: Remove a GitHub identity (reports islands that still referenced it)
      operationId: deleteGitHubIdentity
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteGitHubIdentityResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/credentials/github/{name}/repos:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Identity name
    get:
      tags: [credentials]
      summary: List the repositories a GitHub identity can access (fetched daemon-side)
      operationId: gitHubRepos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubReposResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: Upstream GitHub call failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v1/credentials/providers:
    get:
      tags: [credentials]
      summary: List LLM provider credentials (masked hint only, no keys)
      operationId: listProviderCreds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialsResponse" }
  /v1/credentials/providers/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string }
        description: Provider name (e.g. anthropic)
    put:
      tags: [credentials]
      summary: Store or update a provider key (write-only; never echoed back)
      operationId: putProviderCred
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutProviderCredentialRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderCredentialsResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
    delete:
      tags: [credentials]
      summary: Remove a provider credential (reports islands that still reference it)
      operationId: deleteProviderCred
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteProviderCredentialResponse" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/tokens:
    get:
      tags: [tokens]
      summary: "List issued operator tokens (owner-only; never returns secrets)"
      operationId: listTokens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokensResponse" }
    post:
      tags: [tokens]
      summary: "Mint an operator bearer token (owner-only; secret returned once)"
      description: >
        Issues a role/island-scoped operator token. The bearer secret is returned
        exactly once in the response and is never stored in the clear — a lost
        secret means minting a new token, not recovering this one.
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTokenRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateTokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Token id
    delete:
      tags: [tokens]
      summary: "Revoke an operator token by id (owner-only)"
      operationId: revokeToken
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/events/subscribe:
    post:
      tags: [events]
      summary: Subscribe a webhook URL to state-change events
      operationId: subscribeWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubscribeWebhookRequest" }
      responses:
        "201":
          description: Subscribed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscription" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/events/subscriptions:
    get:
      tags: [events]
      summary: List webhook subscriptions
      operationId: listSubscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscription" }
  /v1/events/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Subscription id
    delete:
      tags: [events]
      summary: Remove a webhook subscription
      operationId: unsubscribeWebhook
      responses:
        "204": { description: Removed }
  /v1/activity:
    get:
      tags: [activity]
      summary: Team activity feed — curated "who launched what, which agent did what"
      description: >
        A read-only, human-rendered timeline projected over the audit ledger:
        operator/account actions (from `api.request` records, when `--audit` is
        on) plus always-on brokered agent↔host activity (port/capability/MCP),
        enriched with each island's owner. Newest-first. A scoped token only sees
        activity for islands in its scope. `audit_enabled` flags whether the
        operational log is on (when off, only brokered records appear).
      operationId: activity
      parameters:
        - name: actor
          in: query
          schema: { type: string }
          description: Only items by this actor (token label / operator / island:<name>)
        - name: island
          in: query
          schema: { type: string }
        - name: owner
          in: query
          schema: { type: string }
          description: Only items for islands with this owner label
        - name: kind
          in: query
          schema: { type: string, enum: [lifecycle, broker, system] }
        - name: decision
          in: query
          schema: { type: string, enum: [allowed, denied] }
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Only items at/after this RFC3339 time
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Only items at/before this RFC3339 time
        - name: limit
          in: query
          schema: { type: integer }
          description: Cap the number of items returned (after filtering)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/terminals:
    get:
      tags: [terminals]
      summary: "List host terminals (operator-only; requires --host-terminals)"
      operationId: listTerminals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalsResponse" }
        "403": { $ref: "#/components/responses/HostTerminalsDisabled" }
    post:
      tags: [terminals]
      summary: Create a host terminal
      operationId: createTerminal
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { label: { type: string } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Terminal" }
        "403": { $ref: "#/components/responses/HostTerminalsDisabled" }
  /v1/terminals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Terminal id (e.g. t1)
    patch:
      tags: [terminals]
      summary: Rename a host terminal
      operationId: relabelTerminal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { label: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Terminal" }
        "403": { $ref: "#/components/responses/HostTerminalsDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [terminals]
      summary: Remove a host terminal
      operationId: deleteTerminal
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/HostTerminalsDisabled" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/terminals/{id}/session:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Terminal id
    get:
      tags: [terminals]
      summary: "Host-terminal WebSocket PTY stream. NOTE: WebSocket upgrade — see SessionEnvelope."
      operationId: terminalSessionWS
      x-websocket: true
      responses:
        "101": { description: Switching Protocols (WebSocket) }
        "403": { $ref: "#/components/responses/HostTerminalsDisabled" }
  /v1/agent-types:
    get:
      tags: [daemon]
      summary: Handler registry + provider-key hints
      operationId: agentTypes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentTypesResponse" }
  /v1/overview:
    get:
      tags: [daemon]
      summary: Daemon health, VM memory, fleet rollup
      operationId: overview
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewResponse" }
  /v1/aggregate:
    get:
      tags: [daemon]
      summary: Privacy-preserving host-wide rollup (counts + total mem/cpu/disk, NO names)
      description: Cross-tenant utilization visible to any authenticated caller — counts + totals across ALL islands, never names/repos/owners/per-island rows. Complements the owner-scoped /v1/overview.
      operationId: aggregate
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AggregateResponse" }
  /v1/healthz:
    get:
      tags: [daemon]
      summary: Reachability probe (token-accessible)
      operationId: healthz
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { status: { type: string, example: ok } }
  /v1/audit:
    get:
      tags: [daemon]
      summary: The audit ledger (brokered ops + api.request + lifecycle) with filtering
      description: >
        Returns the hash-chained audit ledger plus a whole-chain verification
        verdict. Filters compose; `limit` tails the filtered result. With
        `format=jsonl` or `format=csv` the body is a plain-text export of the
        filtered entries instead of the JSON envelope.
      operationId: audit
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
          description: Tail the last N entries after filtering (the full chain is still verified)
        - name: since
          in: query
          schema: { type: string, format: date-time }
          description: Only entries at/after this RFC3339 time
        - name: until
          in: query
          schema: { type: string, format: date-time }
          description: Only entries at/before this RFC3339 time
        - name: island
          in: query
          schema: { type: string }
          description: Only entries for this island
        - name: type
          in: query
          schema: { type: string }
          description: "Only entries whose type has this prefix (e.g. port., api.request)"
        - name: actor
          in: query
          schema: { type: string }
          description: Only entries by this actor (identity subject)
        - name: decision
          in: query
          schema: { type: string, enum: [allowed, denied] }
        - name: format
          in: query
          schema: { type: string, enum: [json, jsonl, csv], default: json }
          description: "json (default) returns AuditResponse; jsonl/csv stream a text export"
      responses:
        "200":
          description: "AuditResponse (format=json), or a text/plain export (jsonl/csv)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditResponse" }
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/clients:
    get:
      tags: [daemon]
      summary: Recent attach/detach events across every island (newest first)
      operationId: clientHistory
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientHistoryEntry" }
  /v1/sessions/revoke:
    post:
      tags: [daemon]
      summary: Drop every active websocket client across every island
      operationId: revokeSessions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { revoked: { type: integer } }
  /v1/panic:
    get:
      tags: [daemon]
      summary: PANIC status (all islands stopped; no auto-start)
      operationId: panicStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanicResponse" }
    post:
      tags: [daemon]
      summary: Engage PANIC — stop every island
      operationId: panic
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PanicRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanicResponse" }
    delete:
      tags: [daemon]
      summary: Clear PANIC and restart islands that should be running
      operationId: unpanic
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanicResponse" }
  /v1/admin/update:
    post:
      tags: [daemon]
      summary: Report (or apply) a daemon self-update
      operationId: adminUpdate
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUpdateResponse" }
  /v1/image/build:
    post:
      tags: [daemon]
      summary: Rebuild the island image (streams combined build output)
      description: >
        Streams the docker-build output as text/plain. A build failure is
        reported as a trailing `ERROR: …` line in the stream (the 200 status is
        already sent by then), and success ends with a `--- dejima: image build
        succeeded ---` marker.
      operationId: imageBuild
      responses:
        "200":
          description: Build output stream
          content:
            text/plain: { schema: { type: string } }
  /v1/ssh/account-keys:
    get:
      tags: [daemon]
      summary: List the fleet-wide authorized SSH keys
      operationId: listAccountKeys
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListSSHKeysResponse" }
    post:
      tags: [daemon]
      summary: Authorize an OpenSSH public key fleet-wide
      operationId: authorizeAccountKey
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthorizeSSHKeyRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorizeSSHKeyResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /metrics:
    get:
      tags: [daemon]
      summary: "Prometheus metrics (text exposition format; not JSON)"
      operationId: metrics
      responses:
        "200":
          description: OK
          content:
            text/plain: { schema: { type: string } }
  /v1/internal/agent-event:
    post:
      tags: [daemon]
      summary: "Internal — agent telemetry sink (notify-hook shims). Not for app use."
      description: >
        Posted by the in-island notify hooks. A token-authenticated caller may
        only emit for its own island (the body's island is overridden by the
        token's island). Listed for completeness; third-party apps consume events
        via webhooks, not by posting here.
      operationId: agentEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentEventRequest" }
      responses:
        "202": { description: Accepted }
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
      description: Per-island bearer token (DEJIMA_TOKEN) for the autonomy path.
  parameters:
    Name:
      name: name
      in: path
      required: true
      schema: { type: string }
      description: Island name
    AgentID:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: Agent id (e.g. p1, p2)
  responses:
    NotFound:
      description: Island, agent, or resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    HostTerminalsDisabled:
      description: Host terminals are disabled (start dejimad with --host-terminals)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
    CreateIslandRequest:
      type: object
      required: [repo]
      properties:
        name: { type: string, description: optional; derived from repo if empty }
        repo: { type: string, description: git URL or local path }
        agent: { type: string, default: claude-code }
        image: { type: string, default: "dejima/island:latest" }
        cmd: { type: string, description: "entrypoint for agent=headless (required then; ignored otherwise)" }
        resources: { $ref: "#/components/schemas/Resources" }
        agents:
          type: array
          description: "Seed a multi-agent island; element 0 is the primary."
          items: { $ref: "#/components/schemas/AgentSpecRequest" }
        role: { type: string, description: "\"\" (work island) or \"home\" (assistant brain; must be headless)" }
        github_identity: { type: string, description: which daemon GitHub identity to clone/push as }
        seed_path: { type: string, description: host path bind-mounted read-only as the clone source (local daemon only) }
        owner: { type: string }
        tags: { type: object, additionalProperties: { type: string } }
    CreateIslandResponse:
      allOf:
        - $ref: "#/components/schemas/IslandInfo"
        - type: object
          properties:
            token:
              type: string
              description: only present on a token-authenticated (Home-Island spawn) create
    UpdateIslandRequest:
      type: object
      description: >
        Cosmetic, in-place-editable island fields. Each property is optional and
        applied only when present, so updating one never clobbers the other.
      properties:
        title: { type: string }
        no_hibernate:
          type: boolean
          description: Pin the island awake — exempt it from idle auto-hibernate.
    CreateScheduleRequest:
      type: object
      description: >
        A durable scheduled wake. Exactly one of `every` (recurring) or `at`
        (one-shot) is required.
      properties:
        every: { type: string, description: "Recurring cadence as a Go duration, e.g. 720h" }
        at: { type: string, format: date-time, description: "One-shot wake time (RFC3339)" }
        task: { type: string, description: "Prompt injected into the agent on wake" }
        agent: { type: string, description: "Agent id/label to run the task; empty = primary" }
    ScheduleInfo:
      type: object
      properties:
        id: { type: string }
        every: { type: string }
        task: { type: string }
        agent: { type: string }
        next_due: { type: string, format: date-time }
        last_run: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    CloneIslandRequest:
      type: object
      required: [new_name]
      properties:
        new_name: { type: string }
    AgentSpecRequest:
      type: object
      properties:
        type: { type: string, description: "agent handler — claude-code, codex, shell, openclaw, headless, …" }
        label: { type: string }
        cmd: { type: string, description: required for a generic headless type }
        provider: { type: string, description: names a daemon provider credential }
        model: { type: string, description: "\"provider/model\" string" }
        ephemeral: { type: boolean, description: "agent-initiated spawn: an in-island token MUST set this (it may only create ephemeral sub-agents, within the operator spawn grant)" }
        spawned_by: { type: string, description: spawning agent's id (lineage / depth-cap input) }
    AgentConfigRequest:
      type: object
      description: Pointer-style — omit a field to leave it unchanged; "" clears it.
      properties:
        provider: { type: [string, "null"] }
        model: { type: [string, "null"] }
    AgentConfigResponse:
      type: object
      properties:
        provider: { type: string }
        model: { type: string }
        restart_required: { type: boolean }
    Resources:
      type: object
      properties:
        memory: { type: string }
        cpus: { type: string }
        disk: { type: string }
        oom_priority: { type: [integer, "null"] }
    UpdateResourcesRequest:
      type: object
      description: Pointer-style — omit a field to leave it unchanged.
      properties:
        memory: { type: [string, "null"], description: "e.g. 4g; \"\" = unlimited; omit = unchanged" }
        oom_priority: { type: [integer, "null"] }
    UpdateResourcesResponse:
      type: object
      properties:
        resources: { $ref: "#/components/schemas/Resources" }
        restart_required: { type: boolean }
    ExecRequest:
      type: object
      required: [cmd]
      properties:
        cmd: { type: array, items: { type: string } }
    ExecResponse:
      type: object
      properties:
        stdout: { type: string }
        stderr: { type: string }
        exit_code: { type: integer }
    MailboxSendRequest:
      type: object
      required: [payload]
      properties:
        from: { type: string, description: Sender agent id }
        to: { type: string, description: Recipient agent id; empty broadcasts to the island }
        topic: { type: string }
        payload: { type: string }
    MailboxMessage:
      type: object
      properties:
        seq: { type: integer, format: int64 }
        island: { type: string }
        from: { type: string }
        from_label: { type: string, description: Sender agent's human name (daemon-resolved at read time); empty for an unknown/cross-island handle or unlabeled agent }
        to: { type: string }
        to_label: { type: string, description: Recipient agent's human name; empty for a broadcast or unlabeled agent }
        topic: { type: string }
        payload: { type: string }
        time: { type: string, format: date-time }
        origin:
          $ref: "#/components/schemas/MailboxOrigin"
        action:
          $ref: "#/components/schemas/MailboxAction"
    MailboxSendResponse:
      description: >
        Response to a mailbox send. The delivered message is embedded inline, so
        the JSON stays byte-compatible with the bare MailboxMessage older clients
        decode. The additive fields are present only when a DIRECTED `to` matched
        NEITHER an id NOR a label in the island's current roster: delivery still
        happens (the mailbox is permissive), but the sender is warned. The signal
        is server-authoritative — derived from the same roster the daemon resolved
        the recipient against.
      allOf:
        - $ref: "#/components/schemas/MailboxMessage"
        - type: object
          properties:
            unknown_recipient:
              type: boolean
              description: True when the directed recipient matched no agent in the roster (still delivered).
            roster:
              type: array
              description: The island's current agents at send time, so the sender can name a valid recipient. Present only with unknown_recipient.
              items: { $ref: "#/components/schemas/RosterAgent" }
    RosterAgent:
      type: object
      description: Minimal (id, label) view of a current agent, carried in a MailboxSendResponse.
      properties:
        id: { type: string }
        label: { type: string }
    MailboxAction:
      type: object
      description: >
        Present only on a cross-island ACTION delegation (Lane 5 Phase 3): a NAMED,
        typed operation the recipient island exposed, authorized by the daemon's
        action gate. The recipient runs its handler for Type — never interpreting
        the payload as a free-form prompt.
      properties:
        type: { type: string }
        params: { type: string }
    MailboxOrigin:
      type: object
      description: >
        Daemon-stamped provenance, present only on messages delivered from another
        island over a brokered link (Lane 5). Absent for ordinary intra-island
        messages. Unforgeable — agents cannot set it.
      properties:
        source_island: { type: string }
        cross_island: { type: boolean }
        from_label: { type: string, description: "sender's display label, daemon-stamped from the source island's roster at send time (display-only; absent → fall back to the message's from id)" }
    MailboxPollResponse:
      type: object
      properties:
        messages: { type: array, items: { $ref: "#/components/schemas/MailboxMessage" } }
        latest: { type: integer, format: int64 }
    LinkGrantRequest:
      type: object
      required: [from, to, topic]
      properties:
        from: { type: string, description: Source island }
        to: { type: string, description: Destination island }
        topic: { type: string, description: Named channel }
        actions: { type: array, items: { type: string }, description: "Phase 3 pre-authorized action types on this channel; empty = info-only" }
    LinkGrant:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        topic: { type: string }
        actions: { type: array, items: { type: string }, description: "Phase 3 per-action allowlist; empty = info-only" }
        created_at: { type: string, format: date-time }
    LinksResponse:
      type: object
      properties:
        grants: { type: array, items: { $ref: "#/components/schemas/LinkGrant" } }
    PolicyRule:
      type: object
      description: A scoped auto-approve rule for the action gate. Topic-agnostic (the link grant gates the channel); destructive actions are never auto-approved regardless.
      properties:
        from: { type: string }
        to: { type: string }
        action: { type: string }
        max_count: { type: integer, description: "0 = unlimited within the TTL window" }
        used: { type: integer }
        expires_at: { type: string, format: date-time, description: "omitted = no expiry" }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    PolicyAddRequest:
      type: object
      required: [from, to, action]
      properties:
        from: { type: string }
        to: { type: string }
        action: { type: string, description: Named action type to auto-approve over from→to }
        max_count: { type: integer, description: "0 = unlimited within the TTL" }
        ttl: { type: string, description: "Go duration (e.g. 1h, 30m); empty = no expiry" }
    PolicyListResponse:
      type: object
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/PolicyRule" } }
    DenyActionRequest:
      type: object
      properties:
        reason: { type: string, description: "Optional human-readable reason, recorded in the ledger" }
    LinkSendRequest:
      type: object
      required: [to, to_agent, topic, payload]
      properties:
        to: { type: string, description: Destination island }
        to_agent: { type: string, description: Destination agent id (required — no island-wide broadcast) }
        topic: { type: string }
        payload: { type: string }
        from_agent: { type: string, description: Sending agent id (optional) }
    LinkActionRequest:
      type: object
      required: [to, to_agent, topic, action]
      properties:
        to: { type: string, description: Destination island }
        to_agent: { type: string, description: Destination agent id }
        topic: { type: string, description: The granted channel }
        action: { type: string, description: Named action type the destination exposed }
        params: { type: string, description: Optional typed params }
        from_agent: { type: string }
    LinkActionResponse:
      type: object
      properties:
        status: { type: string, enum: [executed, pending] }
        pending: { type: string, description: Pending approval id when status is "pending" }
    LinkExposedResponse:
      type: object
      properties:
        island: { type: string }
        actions: { type: array, items: { type: string } }
    LinkActionPending:
      type: object
      properties:
        id: { type: string }
        from: { type: string }
        from_agent: { type: string }
        from_label: { type: string, description: "sender display label, daemon-stamped from the source roster at send time (display-only; absent → fall back to from_agent)" }
        to: { type: string }
        to_agent: { type: string }
        to_label: { type: string, description: "recipient display label, daemon-stamped from the destination roster (display-only; absent → fall back to to_agent)" }
        topic: { type: string }
        action: { type: string }
        tier: { type: string, enum: [benign, mutating, destructive] }
        params: { type: string }
        created_at: { type: string, format: date-time }
    LinkPendingResponse:
      type: object
      properties:
        pending: { type: array, items: { $ref: "#/components/schemas/LinkActionPending" } }
    IslandInfo:
      type: object
      properties:
        name: { type: string }
        title: { type: string }
        repo: { type: string }
        agent: { type: string }
        image: { type: string }
        cmd: { type: string }
        role: { type: string }
        owner: { type: string }
        tags: { type: object, additionalProperties: { type: string } }
        state: { type: string, description: desired state from config }
        container: { type: string, description: observed runtime status }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        attached:
          type: array
          items: { $ref: "#/components/schemas/PresenceEntry" }
        stats:
          allOf: [ { $ref: "#/components/schemas/IslandStats" } ]
          description: cached container resource usage (running islands); on both list and detail
        agent_state: { $ref: "#/components/schemas/AgentStateInfo" }
        git: { $ref: "#/components/schemas/GitInfo" }
        health:
          allOf: [ { $ref: "#/components/schemas/IslandHealth" } ]
          description: container crash health (oom/restart/exit); detail endpoint only
        disk:
          allOf: [ { $ref: "#/components/schemas/IslandDisk" } ]
          description: on-disk volume usage; detail endpoint only
        resources:
          allOf: [ { $ref: "#/components/schemas/Resources" } ]
          description: configured caps + OOM priority; on both list and detail (pairs with stats to compute % of cap)
        agents:
          type: array
          items: { $ref: "#/components/schemas/AgentInfo" }
        identity:
          allOf: [ { $ref: "#/components/schemas/IslandIdentity" } ]
          description: operator-set visual color+glyph override; omitted when unset
    IslandIdentity:
      type: object
      required: [color, glyph]
      properties:
        color: { type: string, description: "hex color: #rgb or #rrggbb" }
        glyph: { type: string, description: exactly one rune }
    AgentInfo:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        label: { type: string }
        tmux: { type: string }
        branch: { type: string }
        worktree: { type: string }
        attachable: { type: boolean }
        created_at: { type: string, format: date-time }
        state: { type: string, description: "session liveness: running | stopped | exited (detail only)" }
        agent_state: { $ref: "#/components/schemas/AgentStateInfo" }
        attached:
          type: array
          items: { $ref: "#/components/schemas/PresenceEntry" }
        restarts: { type: integer }
        error: { type: string, description: last orchestration failure }
        error_at: { type: string, format: date-time }
        provider: { type: string }
        model: { type: string }
        provider_key_set: { type: boolean }
        auth_state: { type: string, description: "\"missing-provider-auth\" or \"\" (ready)" }
        usage: { $ref: "#/components/schemas/AgentUsage" }
        ephemeral: { type: boolean, description: an agent-spawned sub-agent (auto-reaped; counts against the spawn budget) }
        spawned_by: { type: string, description: id of the agent that spawned this one (lineage; empty for operator-created) }
        spawned_by_label: { type: string, description: human name of the spawning agent (so lineage renders as a name) }
    AgentUsage:
      type: object
      description: >-
        Adapter-reported token/cost for the agent's session (Claude Code today),
        ingested from the agent's own usage hook over the in-island token path.
        Omitted entirely for adapters that don't report (clients render "n/a").
      properties:
        input_tokens: { type: integer, description: "all input-side tokens (fresh + cached), so input + output == total" }
        output_tokens: { type: integer }
        total_tokens: { type: integer }
        cost_usd: { type: number, description: "omitted when the model isn't priced (cost renders n/a; tokens still show)" }
        source: { type: string, description: "reporting adapter, e.g. claude-code" }
        as_of: { type: string, format: date-time }
    PresenceEntry:
      type: object
      properties:
        label: { type: string }
        joined_at: { type: string, format: date-time }
    AgentStateInfo:
      type: object
      properties:
        latest: { type: string, description: "e.g. waiting-for-input, task-complete, error" }
        updated_at: { type: string, format: date-time }
    IslandStats:
      type: object
      properties:
        memory_usage_bytes: { type: integer }
        memory_limit_bytes: { type: integer }
        cpu_percent: { type: number }
    GitInfo:
      type: object
      properties:
        branch: { type: string }
        clean: { type: boolean }
        ahead: { type: integer }
        behind: { type: integer }
        dirty_files: { type: integer }
    IslandHealth:
      type: object
      properties:
        oom_killed: { type: boolean }
        restart_count: { type: integer }
        exit_code: { type: integer }
    IslandDisk:
      type: object
      properties:
        workspace_bytes: { type: integer }
        home_bytes: { type: integer }
        total_bytes: { type: integer }
    Event:
      type: object
      properties:
        type: { type: string, description: "e.g. island.created, agent.task-complete" }
        island: { type: string }
        agent: { type: string }
        agent_label: { type: string, description: the agent's human name (daemon-resolved at emit time); empty for island-level events or unlabeled agents }
        timestamp: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    EgressEvent:
      type: object
      description: One outbound connection from an island observed by the egress proxy. Destination host only (no payload/path) — egress observability is "who did it talk to," not content.
      properties:
        island: { type: string }
        host: { type: string, description: destination hostname }
        port: { type: string }
        method: { type: string, description: "\"CONNECT\" (HTTPS tunnel) or the HTTP verb" }
        decision: { type: string, enum: [allow, deny] }
        time: { type: string, format: date-time }
    EgressEventsResponse:
      type: object
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/EgressEvent" }
    EgressPolicy:
      type: object
      description: One island's egress policy. Host matching is exact-or-subdomain (a rule "github.com" covers "api.github.com").
      properties:
        mode: { type: string, enum: [observe, enforce], description: "observe = allow all + log (default); enforce = deny-all except allow" }
        allow: { type: array, items: { type: string }, description: hosts permitted in enforce mode }
        deny: { type: array, items: { type: string }, description: hosts always blocked (even in observe mode) }
    EgressPolicyPatch:
      type: object
      description: Incremental change to an island's egress policy. Empty mode leaves it unchanged; add/remove lists are applied as sets.
      properties:
        mode: { type: string, enum: [observe, enforce] }
        add_allow: { type: array, items: { type: string } }
        remove_allow: { type: array, items: { type: string } }
        add_deny: { type: array, items: { type: string } }
        remove_deny: { type: array, items: { type: string } }
    SpawnGrant:
      type: object
      description: An island's operator-granted budget for ephemeral sub-agents. Co-located sub-agents SHARE the parent island's sandbox (not isolated from it).
      properties:
        island: { type: string }
        max_concurrent: { type: integer, description: max live sub-agents at once }
        max_total: { type: integer, description: max lifetime spawns (0 = unlimited within the grant) }
        types: { type: array, items: { type: string }, description: allowed agent types (empty = any spawnable) }
        ttl: { type: integer, format: int64, description: per-sub-agent max lifetime in nanoseconds (0 = no time cap) }
        per_agent_memory: { type: string, description: "per-sub-agent memory cap, e.g. 512m" }
        per_agent_cpus: { type: string, description: "per-sub-agent cpu cap, e.g. 1.0" }
        created_at: { type: string, format: date-time }
        created_by: { type: string }
    SpawnGrantRequest:
      type: object
      required: [max_concurrent]
      properties:
        max_concurrent: { type: integer }
        max_total: { type: integer }
        types: { type: array, items: { type: string } }
        ttl: { type: string, description: "per-sub-agent lifetime, e.g. \"1h\"" }
        per_agent_memory: { type: string }
        per_agent_cpus: { type: string }
    SpawnGrantResponse:
      type: object
      properties:
        granted: { type: boolean }
        grant: { $ref: "#/components/schemas/SpawnGrant" }
    PortScopeRequest:
      type: object
      required: [host_path]
      properties:
        host_path: { type: string }
        mode: { type: string, enum: [ro, rw], default: ro }
    PortScopeView:
      type: object
      properties:
        name: { type: string }
        host_path: { type: string }
        mode: { type: string }
        granted_at: { type: string, format: date-time }
    PortScopesResponse:
      type: object
