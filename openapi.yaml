        island: { type: string, description: ignored for token-authenticated in-island callers }
        server: { type: string }
        method: { type: string, description: "JSON-RPC method, e.g. tools/list, tools/call" }
        params: { description: "opaque JSON-RPC params passed through to the server" }
    MCPCallResponse:
      type: object
