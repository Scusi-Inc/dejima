        entries:
          type: array
          items: { $ref: "#/components/schemas/LedgerEntry" }
        total: { type: integer, description: entries in the whole ledger (before filtering) }
        returned: { type: integer, description: entries returned after filter + limit }
        verified: { type: boolean, description: whole-chain hash verification result }
