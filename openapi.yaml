        bytes: { type: integer }
        sha256: { type: string }
    PortWriteRequest:
      type: object
      required: [scope, src, dest_rel]
      properties:
        scope: { type: string }
        src: { type: string, description: container path }
        dest_rel: { type: string, description: path within the scope }
    PortWriteResponse:
      type: object
      properties:
