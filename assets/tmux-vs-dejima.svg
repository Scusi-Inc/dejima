<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <rect width="1120" height="500" fill="#0f1e35"/>
  <g font-family="DejaVu Sans">
    <text x="30" y="46" font-size="16" font-weight="bold" fill="#94a3b8" letter-spacing="0.04em">TODAY — tmux + SSH</text>
    <text x="590" y="46" font-size="16" font-weight="bold" fill="#9ec1ff" letter-spacing="0.04em">WITH DEJIMA</text>
    
  <rect x="24" y="70" width="512" height="400" rx="12" fill="#122443" stroke="#1c3358" stroke-width="1.5"/>
  <text x="50" y="104" font-size="20" font-weight="bold" fill="#eef3ff">your Mac mini</text>
  <text x="50" y="128" font-size="15" fill="#94a3b8">one shell, one box, no walls</text>
    
  <rect x="584" y="70" width="512" height="400" rx="12" fill="#122443" stroke="#1c3358" stroke-width="1.5"/>
  <text x="610" y="104" font-size="20" font-weight="bold" fill="#eef3ff">your Mac mini</text>
  <text x="610" y="128" font-size="15" fill="#94a3b8">Dejima daemon</text>

    <!-- left: open reach — every agent to the files node, and to each other -->
    <line x1="140" y1="218" x2="420" y2="218" stroke="#94a3b8" stroke-width="1.4" opacity="0.5" stroke-dasharray="3 5"/>
    
      <line x1="140" y1="218" x2="280" y2="360" stroke="#94a3b8" stroke-width="1.4" opacity="0.6"/>
      
  <rect x="84" y="174" width="112" height="44" rx="7" fill="#0f1e35" stroke="#1c3358"/>
      <text x="140" y="201" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">claude</text>
      <line x1="280" y1="218" x2="280" y2="360" stroke="#94a3b8" stroke-width="1.4" opacity="0.6"/>
      
  <rect x="224" y="174" width="112" height="44" rx="7" fill="#0f1e35" stroke="#1c3358"/>
      <text x="280" y="201" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">claude</text>
      <line x1="420" y1="218" x2="280" y2="360" stroke="#94a3b8" stroke-width="1.4" opacity="0.6"/>
      
  <rect x="364" y="174" width="112" height="44" rx="7" fill="#0f1e35" stroke="#1c3358"/>
      <text x="420" y="201" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">claude</text>
    <rect x="154" y="360" width="252" height="56" rx="7" fill="#0f1e35" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="280" y="394" font-size="15" fill="#eef3ff" text-anchor="middle">your files · ~/.ssh · API tokens</text>

    <!-- right: three sealed islands, one gated crossing, a ledger -->
    
      <rect x="610" y="160" width="140" height="86" rx="8" fill="#0a172d" stroke="#9ec1ff" stroke-width="1.8"/>
      <text x="624" y="184" font-size="13" font-family="DejaVu Sans Mono" fill="#94a3b8">a1</text>
      <text x="680" y="218" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">agent</text>
      <rect x="766" y="160" width="140" height="86" rx="8" fill="#0a172d" stroke="#9ec1ff" stroke-width="1.8"/>
      <text x="780" y="184" font-size="13" font-family="DejaVu Sans Mono" fill="#94a3b8">a2</text>
      <text x="836" y="218" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">agent</text>
      <rect x="922" y="160" width="140" height="86" rx="8" fill="#0a172d" stroke="#9ec1ff" stroke-width="1.8"/>
      <text x="936" y="184" font-size="13" font-family="DejaVu Sans Mono" fill="#94a3b8">a3</text>
      <text x="992" y="218" font-size="14" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">agent</text>
    <!-- collapse the three islands to a single gate -->
    <line x1="680" y1="246" x2="840" y2="300" stroke="#1c3358" stroke-width="1.4"/><line x1="836" y1="246" x2="840" y2="300" stroke="#1c3358" stroke-width="1.4"/><line x1="992" y1="246" x2="840" y2="300" stroke="#1c3358" stroke-width="1.4"/>
    <rect x="812" y="292" width="56" height="40" rx="6" fill="#0f1e35" stroke="#9ec1ff" stroke-width="1.8"/>
    <rect x="833" y="304" width="14" height="20" rx="2" fill="none" stroke="#9ec1ff" stroke-width="1.4"/>
    <text x="840" y="356" font-size="14" font-weight="bold" fill="#9ec1ff" text-anchor="middle">broker</text>
    <line x1="840" y1="332" x2="840" y2="392" stroke="#9ec1ff" stroke-width="1.6"/>
    <rect x="690" y="392" width="252" height="50" rx="7" fill="#0f1e35" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="816" y="422" font-size="15" fill="#eef3ff" text-anchor="middle">your files — granted read-only</text>
    <!-- ledger -->
    <g transform="translate(986,292)">
      <rect width="88" height="100" rx="7" fill="#0a172d" stroke="#1c3358"/>
      <line x1="14" y1="24" x2="74" y2="24" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="14" y1="46" x2="74" y2="46" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="14" y1="68" x2="74" y2="68" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="14" y1="90" x2="74" y2="90" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
    </g>
    <text x="1030" y="412" font-size="13" fill="#94a3b8" text-anchor="middle">ledger</text>

    <!-- captions -->
    <text x="30" y="496" font-size="14" fill="#94a3b8">Every agent can read everything. No record of what it touched.</text>
    <text x="590" y="496" font-size="14" fill="#94a3b8">Deny-all. One gated crossing, granted read-only, every crossing logged.</text>
  </g>
</svg>