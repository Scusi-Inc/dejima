<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470">
  <rect width="1120" height="470" fill="#0f1e35"/>
  <!-- harbor rings behind the island -->
  <g transform="translate(560,250)" fill="none" stroke="#1c3358">
    <circle r="150" opacity="0.30"/><circle r="240" opacity="0.20"/><circle r="330" opacity="0.12"/>
  </g>
  <g font-family="DejaVu Sans">
    <!-- mainland: your machine -->
    <path d="M 0 60 L 250 60 Q 285 130 250 200 L 285 250 L 250 300 Q 285 370 250 410 L 0 410 Z"
          fill="#122443" stroke="#1c3358"/>
    <g transform="translate(95,205)">
      <rect x="-44" y="-30" width="88" height="60" rx="6" fill="#0a172d" stroke="#9ec1ff" stroke-width="1.6"/>
      <line x1="-44" y1="-8" x2="44" y2="-8" stroke="#9ec1ff" stroke-width="1.2" opacity="0.6"/>
      <circle cx="0" cy="11" r="4" fill="#9ec1ff"/>
    </g>
    <text x="95" y="285" font-size="17" font-weight="bold" fill="#eef3ff" text-anchor="middle">your machine</text>
    <text x="95" y="308" font-size="14" fill="#94a3b8" text-anchor="middle">files · credentials</text>

    <!-- the bridge: one gated crossing (the broker) -->
    <line x1="285" y1="241" x2="404" y2="241" stroke="#9ec1ff" stroke-width="2"/>
    <line x1="285" y1="259" x2="404" y2="259" stroke="#9ec1ff" stroke-width="2"/>
    <line x1="318" y1="241" x2="318" y2="259" stroke="#1c3358" stroke-width="1.4"/>
    <line x1="371" y1="241" x2="371" y2="259" stroke="#1c3358" stroke-width="1.4"/>
    <!-- gate at the island end -->
    <rect x="392" y="226" width="26" height="48" rx="4" fill="#0a172d" stroke="#9ec1ff" stroke-width="1.8"/>
    <rect x="401" y="242" width="8" height="16" rx="2" fill="none" stroke="#9ec1ff" stroke-width="1.4"/>
    <text x="346" y="214" font-size="15" font-weight="bold" fill="#9ec1ff" text-anchor="middle">broker</text>
    <text x="346" y="300" font-size="14" fill="#94a3b8" text-anchor="middle">one gated crossing</text>

    <!-- the fan-shaped island -->
    <line x1="416" y1="250" x2="645.6172338418739" y2="70" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/><line x1="416" y1="250" x2="650.9753086855766" y2="140" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/><line x1="416" y1="250" x2="657.5028925139907" y2="220" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/><line x1="416" y1="250" x2="664.1532836621135" y2="300" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/><line x1="416" y1="250" x2="670.5994170290267" y2="380" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/><line x1="416" y1="250" x2="674.3827661581261" y2="430" stroke="#1c3358" stroke-width="1.4" opacity="0.7"/>
    <path d="M 416 205 L 660 70 Q 742 250 660 430 L 416 295 Z"
          fill="#0a172d" stroke="#9ec1ff" stroke-width="2.2" opacity="0.97"/>
    <!-- agents on the island -->
    
      <g transform="translate(520,150)">
        <circle r="13" fill="#0f1e35" stroke="#9ec1ff" stroke-width="1.8"/>
        <text y="5" font-size="12" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">a1</text>
      </g>
      <g transform="translate(520,250)">
        <circle r="13" fill="#0f1e35" stroke="#9ec1ff" stroke-width="1.8"/>
        <text y="5" font-size="12" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">a2</text>
      </g>
      <g transform="translate(520,350)">
        <circle r="13" fill="#0f1e35" stroke="#9ec1ff" stroke-width="1.8"/>
        <text y="5" font-size="12" font-family="DejaVu Sans Mono" fill="#9ec1ff" text-anchor="middle">a3</text>
      </g>
    <text x="600" y="250" font-size="15" fill="#94a3b8">agents, contained</text>
    <text x="585" y="455" font-size="17" font-weight="bold" fill="#eef3ff" text-anchor="middle">Dejima — the contained island</text>

    <!-- ledger: the harbor record -->
    <g transform="translate(815,150)">
      <rect width="150" height="118" rx="8" fill="#122443" stroke="#1c3358"/>
      <line x1="20" y1="26" x2="118" y2="26" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="20" y1="50" x2="118" y2="50" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="20" y1="74" x2="118" y2="74" stroke="#94a3b8" stroke-width="2" opacity="0.7"/><line x1="20" y1="98" x2="118" y2="98" stroke="#94a3b8" stroke-width="2" opacity="0.7"/>
      <circle cx="130" cy="26" r="3.2" fill="#9ec1ff"/><circle cx="130" cy="50" r="3.2" fill="#9ec1ff"/><circle cx="130" cy="74" r="3.2" fill="#9ec1ff"/><circle cx="130" cy="98" r="3.2" fill="#9ec1ff"/>
    </g>
    <text x="890" y="296" font-size="15" font-weight="bold" fill="#9ec1ff" text-anchor="middle">every crossing →</text>
    <text x="890" y="317" font-size="14" fill="#94a3b8" text-anchor="middle">tamper-evident ledger</text>
  </g>
</svg>